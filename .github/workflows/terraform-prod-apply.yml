name: "[Terraform] Prod Apply"

run-name: "[Terraform] Prod Apply"

on:
  push:
    branches:
      - main
    paths:
      - 'infra/environments/prod/**'
      - 'infra/modules/**'
      - 'gitops/applications/prod/**'
      - '.github/workflows/terraform-prod-apply.yml'
      - '.github/workflows/terraform-prod-network.yml'
      - '.github/workflows/terraform-prod-cluster.yml'
      - '.github/workflows/terraform-prod-platform.yml'
      - '.github/workflows/terraform-prod-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: terraform-prod-apply
  cancel-in-progress: false

jobs:
  # Nothing touches prod until a required reviewer approves the `prod` environment.
  # Only this job uses the environment, so the AWS role's OIDC subject is unchanged.
  approve:
    name: Approve prod apply
    runs-on: ubuntu-24.04
    environment: prod
    permissions: {}
    steps:
      - name: Approved
        env:
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
        run: echo "Prod apply of ${GITHUB_SHA::7} approved ($EVENT by $ACTOR)."

  network:
    name: Prod Network
    needs: approve
    uses: ./.github/workflows/terraform-prod-network.yml
    secrets: inherit

  cluster:
    name: Prod Cluster
    needs: network
    uses: ./.github/workflows/terraform-prod-cluster.yml
    secrets: inherit

  platform:
    name: Prod Platform
    needs: cluster
    uses: ./.github/workflows/terraform-prod-platform.yml
    secrets: inherit

  bootstrap:
    name: Prod Bootstrap
    needs: platform
    uses: ./.github/workflows/terraform-prod-bootstrap.yml
    secrets: inherit